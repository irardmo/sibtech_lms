        <div class="main-panel">
            <div class="content-wrapper">
                <div class="page-header">
                    <h3 class="page-title">Employee Evaluation Form</h3>
                </div>
                <div class="row">
                    <div class="col-md-12 grid-margin">
                        <div class="card">
                            <div class="card-body">
                                <h4 class="card-title">Evaluation Details</h4>
                                <form class="forms-sample">
                                    <div class="form-group row">
                                        <label for="employeeName" class="col-sm-3 col-form-label">Employee Name</label>
                                        <div class="col-sm-9">
                                            <input type="text" class="form-control" id="employeeName" placeholder="Employee Name">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="employeeId" class="col-sm-3 col-form-label">Employee ID</label>
                                        <div class="col-sm-9">
                                            <input type="text" class="form-control" id="employeeId" placeholder="Employee ID">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="evaluationDate" class="col-sm-3 col-form-label">Evaluation Date</label>
                                        <div class="col-sm-9">
                                            <input type="date" class="form-control" id="evaluationDate">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="jobKnowledge" class="col-sm-3 col-form-label">Job Knowledge</label>
                                        <div class="col-sm-9">
                                            <select class="form-control" id="jobKnowledge">
                                                <option>Excellent</option>
                                                <option>Good</option>
                                                <option>Average</option>
                                                <option>Fair</option>
                                                <option>Poor</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="workQuality" class="col-sm-3 col-form-label">Work Quality</label>
                                        <div class="col-sm-9">
                                            <select class="form-control" id="workQuality">
                                                <option>Excellent</option>
                                                <option>Good</option>
                                                <option>Average</option>
                                                <option>Fair</option>
                                                <option>Poor</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label for="comments">Comments</label>
                                        <textarea class="form-control" id="comments" rows="4"></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary mr-2">Submit</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
